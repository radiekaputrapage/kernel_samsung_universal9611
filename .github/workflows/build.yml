name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bash git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python3 tar

      - name: Download & Extract WeebX Clang
        run: |
          echo "🔧 Downloading WeebX Clang..."
          wget "$(curl -s https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt)" -O weebx-clang.tar.gz
          mkdir -p toolchain
          tar -xvf weebx-clang.tar.gz -C toolchain
          rm -rf weebx-clang.tar.gz
          echo "✅ Toolchain installed to ./toolchain"

      - name: Set PATH for Clang
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          echo $PATH

      - name: Build kernel (Galaxy A51 OneUI)
        run: |
          echo "🚀 Starting build for Galaxy A51 (OneUI)"
          python3 build_kernel.py --oneui --target=a51 --no-ksu

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-A51-Kernel
          path: GrassKernel_a51_OneUI_*.zip
