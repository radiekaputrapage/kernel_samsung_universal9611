name: Build Kernel - Galaxy A51 (OneUI)

on:
  workflow_dispatch:
  push:
    branches:
      - Grass-Unified  # ganti dengan branch kernel kamu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: ⚙️ Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python3

    - name: 🧰 Clone WeebX-Clang toolchain
      run: |
        git clone --depth=1 https://github.com/XSans0/WeebX-Clang clang
        export PATH=$(pwd)/clang/bin:$PATH
        ln -sf $(pwd)/clang $(pwd)/toolchain
        echo "🔧 Linked clang → toolchain"

    - name: 🚀 Start build for Galaxy A51 (OneUI)
      run: |
        echo "🔨 Starting build process..."
        python3 build_kernel.py --oneui --target=a51

    - name: 📦 Upload built kernel (zImage, dtb, etc)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Galaxy-A51-OneUI-Kernel
        path: |
          out/
          AnyKernel3/
          *.zip
          *.img
